name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes in training_data.csv
        id: check_changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- training_data.csv)
          elif [[ "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git ls-tree --name-only "$GITHUB_SHA" -- training_data.csv)
          else
            changed_files=$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" -- training_data.csv)
          fi

          if [[ -n "$changed_files" && -f training_data.csv ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          
```
  python-version: '3.12'
```


      - name: Install dependencies
        if: steps.check_changes.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Train Linear Model
        if: steps.check_changes.outputs.changed == 'true'
        run: python train_model.py

      - name: Save trained model
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linear-model
          path: linear_model.txt
          if-no-files-found: error

  publish:
    needs: train
    if: github.event_name == 'push' && needs.train.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-linear-model
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: linear-model
          path: ${{ runner.temp }}/linear-model

      - name: Update release branch
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git switch --track origin/release
          else
            git switch --orphan release
          fi

          cp "$RUNNER_TEMP/linear-model/linear_model.txt" linear_model.txt
          git add -- linear_model.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update linear model"
          fi

          git push origin HEAD:refs/heads/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "Release $tag" \
            --notes "Automated release generated by CI/CD pipeline." \