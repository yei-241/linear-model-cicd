name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train linear regression model
        run: python train_model.py

      - name: Save trained model
        uses: actions/upload-artifact@v4
        with:
          name: linear-model
          path: |
            linear_model.txt
            linear_model.pkl
          if-no-files-found: error

  publish:
    needs: train
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: linear-model
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          TAG: v${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG" \
            dist/linear_model.txt dist/linear_model.pkl \
            --target "$COMMIT" \
            --title "Linear model $TAG" \
            --notes "Linear regression model trained and released by GitHub Actions."
